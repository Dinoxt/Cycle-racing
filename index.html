<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cycle Racing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Fredoka', sans-serif;
            background-color: #a3e635;
        }
        /* Bright Cartoon Striped Background */
        .striped-bg {
            background: repeating-linear-gradient(
                105deg,
                #a3e635,
                #a3e635 45px,
                #84cc16 45px,
                #84cc16 90px
            );
        }
        /* Thick Dark Navy Outlines & Drop Shadows */
        .cartoon-title {
            color: #ffffff;
            -webkit-text-stroke: 7px #161e31;
            paint-order: stroke fill;
            filter: drop-shadow(0px 6px 0px #161e31);
            letter-spacing: 1px;
        }
        .cartoon-subtitle {
            color: #ffffff;
            -webkit-text-stroke: 4px #161e31;
            paint-order: stroke fill;
            filter: drop-shadow(0px 3px 0px #161e31);
        }
        .cartoon-pill {
            background: #ffffff;
            border: 3.5px solid #161e31;
            box-shadow: 0px 4px 0px #161e31;
            border-radius: 9999px;
            color: #161e31;
            font-weight: 800;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            cursor: pointer;
        }
        .cartoon-pill:active {
            transform: translateY(3px);
            box-shadow: 0px 1px 0px #161e31;
        }
        .cartoon-panel {
            background: #ffffff;
            border: 5px solid #161e31;
            box-shadow: 0px 8px 0px #161e31;
            border-radius: 28px;
        }
        /* Chunky Start Match Button */
        .start-match-btn {
            background: linear-gradient(180deg, #fde047 0%, #facc15 55%, #eab308 100%);
            border: 5px solid #161e31;
            box-shadow: 0px 8px 0px #161e31, inset 0px 4px 0px rgba(255, 255, 255, 0.65);
            border-radius: 9999px;
            color: #ffffff;
            -webkit-text-stroke: 5px #161e31;
            paint-order: stroke fill;
            filter: drop-shadow(0px 3px 0px rgba(22, 30, 49, 0.25));
            font-weight: 800;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
            animation: pulseBounce 1.8s infinite ease-in-out;
        }
        .start-match-btn:hover {
            background: linear-gradient(180deg, #fef08a 0%, #fde047 55%, #facc15 100%);
            transform: scale(1.04) translateY(-2px);
            box-shadow: 0px 10px 0px #161e31, inset 0px 4px 0px rgba(255, 255, 255, 0.8);
        }
        .start-match-btn:active {
            transform: scale(0.98) translateY(5px);
            box-shadow: 0px 3px 0px #161e31;
            animation: none;
        }
        @keyframes pulseBounce {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-6px) scale(1.04);
            }
        }
        /* Floating 3D Rank Labels */
        .racer-label {
            position: absolute;
            transform: translate(-50%, -100%);
            pointer-events: none;
            font-weight: 800;
            color: #ffffff;
            -webkit-text-stroke: 3.5px #161e31;
            paint-order: stroke fill;
            filter: drop-shadow(0px 2px 0px #161e31);
            font-size: 1.15rem;
            white-space: nowrap;
            transition: opacity 0.15s;
        }
        .racer-label.player-label {
            color: #facc15;
            font-size: 1.45rem;
            -webkit-text-stroke: 4px #161e31;
        }
        /* Checkered flag pattern */
        .checkered-box {
            background-image: 
                linear-gradient(45deg, #161e31 25%, transparent 25%), 
                linear-gradient(-45deg, #161e31 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #161e31 75%), 
                linear-gradient(-45deg, transparent 75%, #161e31 75%);
            background-size: 12px 12px;
            background-position: 0 0, 0 6px, 6px -6px, -6px 0;
            background-color: #ffffff;
        }
        /* Anime Radial Speed Lines Overlay for Boost */
        .speed-lines-overlay {
            background: 
                radial-gradient(circle, transparent 48%, rgba(56, 189, 248, 0.28) 85%, rgba(250, 204, 21, 0.35) 100%),
                repeating-conic-gradient(
                    from 0deg,
                    transparent 0deg 4deg,
                    rgba(255, 255, 255, 0.22) 4deg 5.2deg,
                    transparent 5.2deg 11deg
                );
            mask-image: radial-gradient(circle, transparent 46%, black 78%);
            -webkit-mask-image: radial-gradient(circle, transparent 46%, black 78%);
        }
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body class="striped-bg relative select-none">

    <!-- 3D WebGL Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Dynamic Floating 3D Rank Labels Container -->
    <div id="labels-container" class="absolute inset-0 pointer-events-none z-10 overflow-hidden"></div>

    <!-- Speed Lines Overlay -->
    <div id="boost-overlay" class="speed-lines-overlay absolute inset-0 pointer-events-none z-10 opacity-0 transition-opacity duration-150"></div>

    <!-- HUD / UI Overlay -->
    <div class="relative z-20 flex flex-col justify-between w-full h-full p-3 sm:p-5 pointer-events-none">

        <!-- Top Bar (Matches Cup Pong Reference UI) -->
        <div class="flex justify-between items-start w-full">
            <!-- Left Pill: Level & Rank Badge -->
            <div class="cartoon-pill px-4 py-1.5 flex items-center gap-2 text-base sm:text-lg pointer-events-auto">
                <span class="text-[#84cc16]">LVL <span id="hud-level">1</span></span>
                <span class="text-gray-400">-</span>
                <span id="hud-rank-top" class="text-[#38bdf8]">7th</span>
            </div>

            <!-- Center Title & Progress Bar -->
            <div class="flex flex-col items-center">
                <h1 id="main-title" class="cartoon-title text-4xl sm:text-6xl tracking-wide transition-all duration-300">
                    Cycle Racing
                </h1>

                <!-- Level Progress Bar (Matches First Image Pink Progress Bar + Cartoon Outline) -->
                <div class="mt-2 flex items-center bg-white border-[3.5px] border-[#161e31] rounded-full h-7 w-52 sm:w-72 p-1 shadow-[0_4px_0_#161e31] relative">
                    <div id="level-badge" class="bg-[#ec4899] text-white text-xs sm:text-sm font-extrabold px-2.5 py-0.5 rounded-full border-2 border-[#161e31] z-10">
                        1
                    </div>
                    <div class="flex-1 h-full bg-slate-200 rounded-full mx-1.5 overflow-hidden relative">
                        <div id="progress-fill" class="h-full bg-[#f43f5e] w-0 rounded-full transition-all duration-75"></div>
                    </div>
                    <div class="w-6 h-5 rounded-full border-2 border-[#161e31] checkered-box flex-shrink-0"></div>
                </div>

                <!-- Large Live Position Display -->
                <div id="big-rank-display" class="cartoon-subtitle text-4xl sm:text-5xl mt-1">
                    7th
                </div>
            </div>

            <!-- Right Pill: Pause / Restart -->
            <button id="btn-pause" class="cartoon-pill px-4 py-1.5 text-sm sm:text-base pointer-events-auto uppercase tracking-wider invisible">
                PAUSE
            </button>
        </div>

        <!-- Center Prompt / Start Match Overlay / Modals -->
        <div class="flex flex-col items-center justify-center my-auto w-full">

            <!-- Pre-Race Start Match Overlay -->
            <div id="start-overlay" class="flex flex-col items-center gap-4 pointer-events-auto z-30">
                <div class="bg-[#161e31] text-[#facc15] border-[3px] border-white px-4 py-1 rounded-full text-xs sm:text-sm font-extrabold uppercase tracking-widest shadow-[0_4px_0_rgba(0,0,0,0.3)]">
                    🏁 Starting Grid Ready &bull; 7 Riders
                </div>

                <button id="btn-start-match" class="start-match-btn px-9 py-4 sm:px-12 sm:py-5 text-2xl sm:text-4xl flex items-center gap-3.5">
                    <span class="w-7 h-7 sm:w-9 sm:h-9 rounded-full border-[3px] border-[#161e31] checkered-box inline-block flex-shrink-0 shadow-sm"></span>
                    <span>START MATCH</span>
                    <span>&rarr;</span>
                </button>
            </div>

            <!-- Drag / Steering Prompt (Matches "Drag / Flick to Shoot" black pill from Reference 2) -->
            <div id="steer-prompt" class="mt-4 bg-[#161e31]/90 text-white px-5 py-2 rounded-full border-2 border-white/25 text-xs sm:text-sm font-bold tracking-wide shadow-lg animate-pulse transition-opacity duration-300">
                Drag / Touch or Arrow Keys to Steer &bull; Hit Blue Pads!
            </div>

            <!-- Finish / Pause Modal -->
            <div id="game-modal" class="cartoon-panel p-6 sm:p-8 max-w-sm w-[90%] text-center hidden pointer-events-auto transform transition-all">
                <div id="modal-badge" class="inline-block bg-[#facc15] text-[#161e31] border-[3px] border-[#161e31] px-4 py-1 rounded-full font-extrabold text-sm mb-2 shadow-[0_3px_0_#161e31]">
                    RACE COMPLETE
                </div>
                <h2 id="modal-title" class="cartoon-title text-4xl sm:text-5xl mb-2">1st Place!</h2>
                <p id="modal-desc" class="text-[#161e31] font-bold text-base sm:text-lg mb-6">
                    You smoked the competition on the track!
                </p>
                <div class="flex gap-3 justify-center">
                    <button id="btn-retry" class="cartoon-pill px-5 py-2.5 text-base bg-slate-100">
                        RETRY
                    </button>
                    <button id="btn-next" class="cartoon-pill px-6 py-2.5 text-base !bg-[#84cc16] !text-white" style="-webkit-text-stroke: 1.5px #161e31;">
                        NEXT RACE &rarr;
                    </button>
                </div>
            </div>
        </div>

        <!-- Bottom Bar Pills (Matches Sound & vs Bot Pills from Reference 2) -->
        <div class="flex justify-center items-center gap-3 w-full pb-1">
            <button id="btn-sound" class="cartoon-pill px-4 py-1.5 text-xs sm:text-sm flex items-center gap-1.5 pointer-events-auto">
                <span id="sound-icon">🔊</span>
                <span id="sound-text">Sound</span>
            </button>
            <button id="btn-bot-mode" class="cartoon-pill px-4 py-1.5 text-xs sm:text-sm flex items-center gap-1.5 pointer-events-auto">
                <span>🤖</span>
                <span id="bot-text">vs 6 Bots: Normal</span>
            </button>
            <button id="btn-cam" class="cartoon-pill px-4 py-1.5 text-xs sm:text-sm flex items-center gap-1.5 pointer-events-auto hidden sm:flex">
                <span>🎥</span>
                <span id="cam-text">Cam: Chase</span>
            </button>
        </div>

    </div>

    <script>
        /**************************************************************
         * AUDIO SYNTHESIS (Tone.js - Self-contained Cartoon SFX)
         **************************************************************/
        let soundEnabled = true;
        let audioInitialized = false;
        let synth, padSynth, bumpSynth;

        async function initAudio() {
            if (audioInitialized) return;
            try {
                await Tone.start();
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.01, decay: 0.12, sustain: 0.05, release: 0.2 }
                }).toDestination();
                synth.volume.value = -8;

                padSynth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.25, sustain: 0.1, release: 0.3 }
                }).toDestination();
                padSynth.volume.value = -6;

                bumpSynth = new Tone.MembraneSynth().toDestination();
                bumpSynth.volume.value = -5;

                audioInitialized = true;
            } catch (e) {
                console.warn("Audio init skipped:", e);
            }
        }

        function playSound(type) {
            if (!soundEnabled || !audioInitialized) return;
            try {
                const now = Tone.now();
                if (type === 'start') {
                    padSynth.triggerAttackRelease("G4", "16n", now);
                    padSynth.triggerAttackRelease("C5", "16n", now + 0.09);
                    synth.triggerAttackRelease(["E5", "G5", "C6"], "8n", now + 0.18);
                } else if (type === 'boost') {
                    padSynth.triggerAttackRelease("C5", "16n", now);
                    padSynth.triggerAttackRelease("E5", "16n", now + 0.06);
                    padSynth.triggerAttackRelease("G5", "8n", now + 0.12);
                } else if (type === 'bump') {
                    bumpSynth.triggerAttackRelease("G1", "8n", now);
                } else if (type === 'win') {
                    synth.triggerAttackRelease(["C4", "E4", "G4"], "8n", now);
                    synth.triggerAttackRelease(["E4", "G4", "C5"], "8n", now + 0.15);
                    synth.triggerAttackRelease(["G4", "C5", "E5"], "4n", now + 0.3);
                } else if (type === 'lose') {
                    synth.triggerAttackRelease(["G4", "Eb4", "C4"], "4n", now);
                } else if (type === 'click') {
                    padSynth.triggerAttackRelease("A5", "32n", now);
                }
            } catch (e) {}
        }

        /**************************************************************
         * GAME CONFIGURATION & STATE
         **************************************************************/
        const TRACK_WIDTH = 14;
        let TRACK_LENGTH = 850;
        const NUM_BOTS = 6;

        const COLORS = {
            navyOutline: 0x161e31,
            trackSurface: 0x1e293b,     // Crisp dark slate-navy track surface
            sandFloor: 0xffd599,        // Bright sunny golden-peach floor
            sandDark: 0xffbe76,
            whiteLine: 0xffffff,
            boostCyan: 0x00f2fe,
            obstaclePink: 0xff2a6d,
            cactusGreen: 0x7bed9f,
            gold: 0xffdd00,
            skin: 0xffe4c4,
            mesaRed: 0xff7f50
        };

        const RACER_PALETTES = [
            { name: "YOU", shirt: 0xa3e635, helmet: 0xffffff, shorts: 0x15803d, bike: 0xfacc15, visor: 0x38bdf8, isPlayer: true },
            { name: "Bot Red", shirt: 0xff3838, helmet: 0xffcccc, shorts: 0x990000, bike: 0xffffff, visor: 0xffdd00 },
            { name: "Bot Blue", shirt: 0x18dcff, helmet: 0xffffff, shorts: 0x006266, bike: 0xffdd00, visor: 0xff2a6d },
            { name: "Bot Gold", shirt: 0xffdd00, helmet: 0xfff200, shorts: 0xcc8e35, bike: 0xff6348, visor: 0x161e31 },
            { name: "Bot Pink", shirt: 0xff4d88, helmet: 0xffb8d1, shorts: 0x831843, bike: 0xffffff, visor: 0x00f2fe },
            { name: "Bot Cyan", shirt: 0x00f2fe, helmet: 0xffffff, shorts: 0x0a3d62, bike: 0xa3e635, visor: 0xff2a6d },
            { name: "Bot Purple", shirt: 0xc56cf0, helmet: 0xf3a683, shorts: 0x574b90, bike: 0xff9ff3, visor: 0xffdd00 }
        ];

        const HOME_PALETTES = [
            { wall: 0xfffbeb, roof: 0xff4757, door: 0x1e90ff, trim: 0xffffff, awning: 0xff6b81 },
            { wall: 0xe0f2fe, roof: 0xff6348, door: 0xffdd59, trim: 0xffffff, awning: 0x38bdf8 },
            { wall: 0xfef08a, roof: 0x2ed573, door: 0xff4757, trim: 0xffffff, awning: 0x7bed9f },
            { wall: 0xfce7f3, roof: 0xa855f7, door: 0x00f2fe, trim: 0xffffff, awning: 0xf472b6 },
            { wall: 0xdcfce7, roof: 0xf59e0b, door: 0xef4444, trim: 0xffffff, awning: 0xfacc15 }
        ];

        let state = {
            level: 1,
            mode: 'ready',    // 'ready', 'racing', 'paused', 'finished'
            botDifficulty: 1, // 0: Easy, 1: Normal, 2: Pro
            camMode: 0,       // 0: Chase, 1: High Action
            steerInput: 0,
            targetX: 0,
            isDragging: false,
            pointerStartX: 0,
            playerStartX: 0,
            idleTime: 0,
            raceTime: 0
        };

        /**************************************************************
         * THREE.JS SCENE & CEL-SHADED CARTOON GRAPHICS ENGINE
         **************************************************************/
        const canvas = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.5, 520);

        // 1. Custom 4-Step Bright Toon Gradient Map for Crisp Cel-Shaded Lighting
        function createToonGradientMap() {
            const data = new Uint8Array([
                185, 185, 195, 255,
                220, 220, 230, 255,
                245, 245, 250, 255,
                255, 255, 255, 255
            ]);
            const texture = new THREE.DataTexture(data, 4, 1, THREE.RGBAFormat);
            texture.minFilter = THREE.NearestFilter;
            texture.magFilter = THREE.NearestFilter;
            texture.generateMipmaps = false;
            texture.needsUpdate = true;
            return texture;
        }
        const toonGradientMap = createToonGradientMap();

        // 2. Bright Cartoon Lighting (Hemisphere Sky/Sand Bounce + High-Res Sun Shadows)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.78);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xffe0b2, 0.65);
        hemiLight.position.set(0, 60, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xfffef0, 0.92);
        dirLight.position.set(35, 85, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 10;
        dirLight.shadow.camera.far = 240;
        dirLight.shadow.bias = -0.0005;
        const d = 38;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // Helper: Creates a vivid cel-shaded mesh with self-illuminated color pop & dark navy outline
        const outlineMat = new THREE.MeshBasicMaterial({
            color: COLORS.navyOutline,
            side: THREE.BackSide
        });

        const materialCache = new Map();
        function getToonMaterial(colorHex) {
            if (!materialCache.has(colorHex)) {
                const baseColor = new THREE.Color(colorHex);
                materialCache.set(colorHex, new THREE.MeshToonMaterial({
                    color: baseColor,
                    emissive: baseColor,
                    emissiveIntensity: 0.22,
                    gradientMap: toonGradientMap
                }));
            }
            return materialCache.get(colorHex);
        }

        function createCartoonMesh(geometry, colorHex, outlineThickness = 0.08, castShadow = true) {
            const group = new THREE.Group();
            const mat = getToonMaterial(colorHex);
            const mesh = new THREE.Mesh(geometry, mat);
            mesh.castShadow = castShadow;
            mesh.receiveShadow = true;
            group.add(mesh);

            if (outlineThickness > 0) {
                const outline = new THREE.Mesh(geometry, outlineMat);
                outline.scale.set(
                    1 + outlineThickness,
                    1 + outlineThickness,
                    1 + outlineThickness
                );
                group.add(outline);
            }
            return group;
        }

        // Dynamic World Containers
        const trackGroup = new THREE.Group();
        scene.add(trackGroup);

        const fxGroup = new THREE.Group();
        scene.add(fxGroup);

        let boostPads = [];
        let obstacles = [];
        let clouds = [];
        let finishFlags = [];
        let confettiParticles = [];
        let fxParticles = [];
        let racers = [];

        /**************************************************************
         * TRACK, CURBS, PROPS & FINISH ARCH BUILDER
         **************************************************************/
        function buildCheckeredStrip(width, length, cols, rows) {
            const group = new THREE.Group();
            const tileW = width / cols;
            const tileL = length / rows;
            const geo = new THREE.PlaneGeometry(tileW + 0.01, tileL + 0.01);
            geo.rotateX(-Math.PI / 2);

            const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const navyMat = new THREE.MeshBasicMaterial({ color: COLORS.navyOutline });

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const isDark = (r + c) % 2 === 1;
                    const tile = new THREE.Mesh(geo, isDark ? navyMat : whiteMat);
                    tile.position.set(
                        -width / 2 + tileW * (c + 0.5),
                        0,
                        -length / 2 + tileL * (r + 0.5)
                    );
                    group.add(tile);
                }
            }
            return group;
        }

        function buildTrack() {
            // Clear existing track & FX objects
            while (trackGroup.children.length > 0) {
                trackGroup.remove(trackGroup.children[0]);
            }
            while (fxGroup.children.length > 0) {
                fxGroup.remove(fxGroup.children[0]);
            }
            boostPads = [];
            obstacles = [];
            clouds = [];
            finishFlags = [];
            confettiParticles = [];
            fxParticles = [];

            TRACK_LENGTH = 780 + (state.level - 1) * 120;

            // 1. Warm Peach/Tan Ground Table (Matches Reference 2)
            const sandGeo = new THREE.PlaneGeometry(540, TRACK_LENGTH + 450);
            const sandMat = getToonMaterial(COLORS.sandFloor);
            const sandMesh = new THREE.Mesh(sandGeo, sandMat);
            sandMesh.rotation.x = -Math.PI / 2;
            sandMesh.position.set(0, -0.15, -TRACK_LENGTH / 2 + 40);
            sandMesh.receiveShadow = true;
            trackGroup.add(sandMesh);

            // Subtle Darker Sand Dunes / Strips on the sides for depth
            const duneGeo = new THREE.PlaneGeometry(180, TRACK_LENGTH + 400);
            const duneMat = getToonMaterial(COLORS.sandDark);
            [-1, 1].forEach(side => {
                const dune = new THREE.Mesh(duneGeo, duneMat);
                dune.rotation.x = -Math.PI / 2;
                dune.position.set(side * 125, -0.13, -TRACK_LENGTH / 2 + 40);
                dune.receiveShadow = true;
                trackGroup.add(dune);
            });

            // Top Horizon Border Line (Separating Tan Floor & Green Wall like Reference 2)
            const horizonWallBorder = new THREE.Mesh(
                new THREE.BoxGeometry(540, 0.5, 1.8),
                new THREE.MeshBasicMaterial({ color: COLORS.navyOutline })
            );
            horizonWallBorder.position.set(0, 0, -TRACK_LENGTH - 95);
            trackGroup.add(horizonWallBorder);

            // 2. Crisp Dark Navy Track Board with White Borders & 3D Racing Curbs
            const outerBoardGeo = new THREE.BoxGeometry(TRACK_WIDTH + 1.8, 0.22, TRACK_LENGTH + 65);
            const outerBoardMat = new THREE.MeshBasicMaterial({ color: COLORS.navyOutline });
            const outerBoard = new THREE.Mesh(outerBoardGeo, outerBoardMat);
            outerBoard.position.set(0, -0.08, -TRACK_LENGTH / 2 + 12);
            trackGroup.add(outerBoard);

            const whiteTrimGeo = new THREE.BoxGeometry(TRACK_WIDTH + 1.0, 0.25, TRACK_LENGTH + 64);
            const whiteTrimMat = new THREE.MeshBasicMaterial({ color: COLORS.whiteLine });
            const whiteTrim = new THREE.Mesh(whiteTrimGeo, whiteTrimMat);
            whiteTrim.position.set(0, -0.06, -TRACK_LENGTH / 2 + 12);
            trackGroup.add(whiteTrim);

            const innerRoadGeo = new THREE.BoxGeometry(TRACK_WIDTH - 0.1, 0.28, TRACK_LENGTH + 62);
            const innerRoadMat = getToonMaterial(COLORS.trackSurface);
            const innerRoad = new THREE.Mesh(innerRoadGeo, innerRoadMat);
            innerRoad.position.set(0, -0.04, -TRACK_LENGTH / 2 + 12);
            innerRoad.receiveShadow = true;
            trackGroup.add(innerRoad);

            // Alternating Red & White 3D Rumble Curbs along Track Edges
            const curbLen = 4.5;
            const curbGeo = new THREE.BoxGeometry(0.48, 0.16, curbLen);
            const redCurbMat = getToonMaterial(0xff1654);
            const whiteCurbMat = getToonMaterial(0xffffff);
            const totalCurbs = Math.floor((TRACK_LENGTH + 40) / curbLen);
            for (let i = 0; i < totalCurbs; i++) {
                const zPos = 20 - i * curbLen;
                const mat = i % 2 === 0 ? redCurbMat : whiteCurbMat;

                const leftCurb = new THREE.Mesh(curbGeo, mat);
                leftCurb.position.set(-TRACK_WIDTH / 2 - 0.15, 0.12, zPos);
                leftCurb.receiveShadow = true;
                trackGroup.add(leftCurb);

                const rightCurb = new THREE.Mesh(curbGeo, mat);
                rightCurb.position.set(TRACK_WIDTH / 2 + 0.15, 0.12, zPos);
                rightCurb.receiveShadow = true;
                trackGroup.add(rightCurb);
            }

            // Center Dashed Racing Line & Solid Side Lanes
            const dashGeo = new THREE.PlaneGeometry(0.38, 4.2);
            dashGeo.rotateX(-Math.PI / 2);
            const dashMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
            for (let z = 10; z > -TRACK_LENGTH; z -= 9) {
                const dash = new THREE.Mesh(dashGeo, dashMat);
                dash.position.set(0, 0.115, z);
                trackGroup.add(dash);
            }

            // Checkered Starting Grid Strip at Front of Pack
            const startCheckered = buildCheckeredStrip(TRACK_WIDTH - 0.3, 1.8, 14, 2);
            startCheckered.position.set(0, 0.125, -28.5);
            trackGroup.add(startCheckered);

            // 3. Spawn Animated Boost Pads & Dynamic Obstacles along the track
            const numSegments = Math.floor(TRACK_LENGTH / 32);
            for (let i = 2; i < numSegments - 1; i++) {
                const zPos = -i * 32;

                // Cyan Speed Boost Pad with 3 Animated Chevrons
                if (i % 2 === 0 || Math.random() < 0.45) {
                    const padX = (Math.random() - 0.5) * (TRACK_WIDTH - 3.6);
                    const padGroup = new THREE.Group();

                    // Outer dark navy frame + glowing cyan base
                    const padBase = createCartoonMesh(
                        new THREE.BoxGeometry(2.5, 0.12, 4.6),
                        COLORS.boostCyan,
                        0.07,
                        false
                    );
                    padGroup.add(padBase);

                    // 3 Triple-Chevron Arrows on Pad
                    const chevrons = [];
                    for (let c = 0; c < 3; c++) {
                        const chevGroup = new THREE.Group();
                        const barGeo = new THREE.BoxGeometry(0.95, 0.16, 0.26);
                        const barMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

                        const leftWing = new THREE.Mesh(barGeo, barMat);
                        leftWing.position.set(-0.34, 0, 0);
                        leftWing.rotation.y = 0.55;
                        chevGroup.add(leftWing);

                        const rightWing = new THREE.Mesh(barGeo, barMat);
                        rightWing.position.set(0.34, 0, 0);
                        rightWing.rotation.y = -0.55;
                        chevGroup.add(rightWing);

                        chevGroup.position.set(0, 0.04, 1.2 - c * 1.2);
                        padGroup.add(chevGroup);
                        chevrons.push(chevGroup);
                    }

                    padGroup.position.set(padX, 0.11, zPos);
                    trackGroup.add(padGroup);
                    boostPads.push({
                        mesh: padGroup,
                        chevrons,
                        x: padX,
                        z: zPos,
                        width: 2.5,
                        length: 4.6
                    });
                }

                // Cartoon Cup / Barrier Obstacles with Tumbling Physics
                const numObs = Math.random() < 0.45 ? 2 : 1;
                for (let j = 0; j < numObs; j++) {
                    const obsX = (Math.random() - 0.5) * (TRACK_WIDTH - 2.8);
                    const obsZ = zPos - 14 + (Math.random() - 0.5) * 6;

                    const cupGroup = createCartoonCupObstacle(j % 2 === 0 ? 0x65ef19 : 0xff1654);
                    cupGroup.position.set(obsX, 0.1, obsZ);
                    trackGroup.add(cupGroup);

                    obstacles.push({
                        mesh: cupGroup,
                        x: obsX,
                        y: 0.1,
                        z: obsZ,
                        vx: 0,
                        vy: 0,
                        vz: 0,
                        rx: 0,
                        ry: 0,
                        rz: 0,
                        radius: 0.88,
                        hit: false
                    });
                }
            }

            // 4. Colorful Cartoon Neighborhood Homes, Cacti & Mesas along Both Sides of Track
            let homeIdx = 0;
            for (let z = -10; z > -TRACK_LENGTH - 40; z -= 18) {
                [-1, 1].forEach(side => {
                    const rand = Math.random();
                    // Frequent colorful 3D Homes & Cottages lining the road
                    if (rand < 0.58) {
                        const home = createCartoonHome(HOME_PALETTES[homeIdx % HOME_PALETTES.length]);
                        homeIdx++;
                        const homeX = side * (TRACK_WIDTH / 2 + 10.5 + Math.random() * 5);
                        home.position.set(homeX, 0, z + (Math.random() - 0.5) * 4);
                        // Angle home slightly toward the road
                        home.rotation.y = side > 0 ? -Math.PI / 2 + 0.22 : Math.PI / 2 - 0.22;
                        const hs = 0.92 + Math.random() * 0.28;
                        home.scale.set(hs, hs, hs);
                        trackGroup.add(home);
                    } else if (rand < 0.82) {
                        const xOffset = side * (TRACK_WIDTH / 2 + 4.5 + Math.random() * 10);
                        const cactus = createCartoonCactus();
                        cactus.position.set(xOffset, 0, z + (Math.random() - 0.5) * 8);
                        cactus.rotation.y = Math.random() * Math.PI * 2;
                        const s = 0.85 + Math.random() * 0.5;
                        cactus.scale.set(s, s, s);
                        trackGroup.add(cactus);
                    } else {
                        const xOffset = side * (TRACK_WIDTH / 2 + 5.5 + Math.random() * 10);
                        const rock = createDesertRockCluster();
                        rock.position.set(xOffset, 0, z + (Math.random() - 0.5) * 8);
                        rock.rotation.y = Math.random() * Math.PI;
                        trackGroup.add(rock);
                    }

                    // Distant Monument Valley Style Mesas along the outer horizon
                    if (Math.abs(z) % 72 === 10) {
                        const mesa = createDesertMesa();
                        mesa.position.set(side * (38 + Math.random() * 22), -0.1, z - Math.random() * 20);
                        mesa.rotation.y = Math.random() * Math.PI;
                        trackGroup.add(mesa);
                    }
                });
            }

            // 5. Puffy 3D Cartoon Clouds floating in the sky
            for (let z = 0; z > -TRACK_LENGTH - 120; z -= 55) {
                [-1, 1].forEach(side => {
                    if (Math.random() < 0.75) {
                        const cloud = createCartoonCloud();
                        cloud.position.set(
                            side * (18 + Math.random() * 35),
                            18 + Math.random() * 10,
                            z + (Math.random() - 0.5) * 25
                        );
                        const cs = 0.9 + Math.random() * 0.7;
                        cloud.scale.set(cs, cs, cs);
                        trackGroup.add(cloud);
                        clouds.push({
                            mesh: cloud,
                            speedX: (Math.random() * 0.6 + 0.3) * side,
                            baseY: cloud.position.y,
                            phase: Math.random() * Math.PI * 2
                        });
                    }
                });
            }

            // 6. Checkered Finish Arch (From Reference 1)
            const finishArch = createFinishArch();
            finishArch.position.set(0, 0, -TRACK_LENGTH);
            trackGroup.add(finishArch);
        }

            // 1. Chunky Dark Rubber Tire with Cartoon Outline
            const tireGeo = new THREE.TorusGeometry(0.48, 0.13, 10, 20);

                wheelGroup.add(spoke);

            torsoGroup.add(hips);

            // Skin-toned Head
            const headGroup = new THREE.Group();
            headGroup.position.set(0, 0.84, -0.06);
            headGroup.rotation.x = 0.25; // Looking forward down the track
            torsoGroup.add(headGroup);

            const head = createCartoonMesh(new THREE.SphereGeometry(0.31, 14, 14), COLORS.skin, 0.11);
            headGroup.add(head);

            // Wrap-around Sport Sunglasses / Visor
            const visor = createCartoonMesh(new THREE.BoxGeometry(0.52, 0.16, 0.28), palette.visor || 0x38bdf8, 0.12);
            visor.position.set(0, 0.03, -0.2);
            headGroup.add(visor);

            // Aerodynamic Cycling Helmet with Center Stripe
            const helmetDome = createCartoonMesh(new THREE.SphereGeometry(0.36, 14, 12), palette.helmet, 0.11);
            helmetDome.scale.set(1.02, 0.82, 1.22);
            helmetDome.position.set(0, 0.14, 0.04);
            headGroup.add(helmetDome);

            const helmetStripe = new THREE.Mesh(
                new THREE.BoxGeometry(0.14, 0.22, 0.72),
                getToonMaterial(palette.shirt)
            );
            helmetStripe.position.set(0, 0.32, 0.04);
            headGroup.add(helmetStripe);

            // Jersey Sleeves & Arms reaching to Handlebars
            const sleeveGeo = new THREE.CylinderGeometry(0.14, 0.12, 0.36, 10);
            const leftSleeve = createCartoonMesh(sleeveGeo, palette.shirt, 0.12);
            leftSleeve.position.set(-0.42, 0.32, -0.18);
            leftSleeve.rotation.x = Math.PI / 3;
            torsoGroup.add(leftSleeve);

            const rightSleeve = createCartoonMesh(sleeveGeo, palette.shirt, 0.12);
            rightSleeve.position.set(0.42, 0.32, -0.18);
            rightSleeve.rotation.x = Math.PI / 3;
            torsoGroup.add(rightSleeve);

            const armGeo = new THREE.CylinderGeometry(0.1, 0.09, 0.65, 10);
            const leftArm = createCartoonMesh(armGeo, COLORS.skin, 0.12);
            leftArm.position.set(-0.44, 0.06, -0.45);
            leftArm.rotation.x = Math.PI / 2.6;
            torsoGroup.add(leftArm);

            const rightArm = createCartoonMesh(armGeo, COLORS.skin, 0.12);
            rightArm.position.set(0.44, 0.06, -0.45);
            rightArm.rotation.x = Math.PI / 2.6;
            torsoGroup.add(rightArm);

            // 4. Animated Pedaling Legs + Cycling Shoes
            const createLegAssembly = () => {
                const legGroup = new THREE.Group();
                const thigh = createCartoonMesh(new THREE.CylinderGeometry(0.14, 0.11, 0.68, 10), palette.shorts, 0.12);
                legGroup.add(thigh);

                const shoe = createCartoonMesh(new THREE.BoxGeometry(0.22, 0.15, 0.36), 0xffffff, 0.14);
                shoe.position.set(0, -0.36, -0.06);
                legGroup.add(shoe);
                return legGroup;
            };

            const leftLeg = createLegAssembly();
            leftLeg.position.set(-0.27, 0.85, 0.12);
            root.add(leftLeg);

            const rightLeg = createLegAssembly();
            rightLeg.position.set(0.27, 0.85, 0.12);
            root.add(rightLeg);

            return {
                root,
                torsoGroup,
                leftLeg,
                rightLeg,
                backWheel,
                frontWheel,
                playerRing
            };
        }

        /**************************************************************
         * 3D PARTICLE EFFECTS (Dust Puffs, Boost Trails & Impact Sparks)
         **************************************************************/
        const dustGeo = new THREE.DodecahedronGeometry(0.22, 0);
        const boostGeo = new THREE.BoxGeometry(0.22, 0.12, 0.75);
        const sparkGeo = new THREE.OctahedronGeometry(0.24, 0);

        function spawnWheelDust(x, z) {
            if (fxParticles.length > 90) return;
            const mesh = new THREE.Mesh(dustGeo, getToonMaterial(0xfef3c7));
            mesh.position.set(x + (Math.random() - 0.5) * 0.35, 0.22, z + 0.95);
            mesh.rotation.set(Math.random() * 3, Math.random() * 3, 0);
            fxGroup.add(mesh);
            fxParticles.push({
                mesh,
                vx: (Math.random() - 0.5) * 1.6,
                vy: 1.1 + Math.random() * 1.4,
                vz: 2.5 + Math.random() * 2.5,
                life: 0.38,
                maxLife: 0.38
            });
        }

        function spawnBoostTrail(x, z) {
            if (fxParticles.length > 110) return;
            const color = Math.random() < 0.6 ? COLORS.boostCyan : COLORS.gold;
            const mesh = new THREE.Mesh(boostGeo, new THREE.MeshBasicMaterial({ color }));
            mesh.position.set(
                x + (Math.random() - 0.5) * 0.7,
                0.45 + Math.random() * 0.9,
                z + 1.0
            );
            fxGroup.add(mesh);
            fxParticles.push({
                mesh,
                vx: (Math.random() - 0.5) * 1.2,
                vy: (Math.random() - 0.5) * 0.8,
                vz: 6.0 + Math.random() * 4.0,
                life: 0.28,
                maxLife: 0.28
            });
        }

        function spawnImpactBurst(x, y, z, colorHex = 0xfacc15) {
            for (let i = 0; i < 8; i++) {
                const mesh = createCartoonMesh(sparkGeo, i % 2 === 0 ? colorHex : 0xffffff, 0.12, false);
                mesh.position.set(x, y, z);
                fxGroup.add(mesh);
                const angle = (i / 8) * Math.PI * 2;
                fxParticles.push({
                    mesh,
                    vx: Math.cos(angle) * (3.5 + Math.random() * 3),
                    vy: 2.5 + Math.random() * 4.5,
                    vz: Math.sin(angle) * (3.5 + Math.random() * 3),
                    life: 0.45,
                    maxLife: 0.45,
                    gravity: 14
                });
            }
        }

        /**************************************************************
         * RACER SPAWNING & LABELS
         **************************************************************/
        const labelsContainer = document.getElementById('labels-container');

        function spawnRacers() {
            // Remove old racers
            racers.forEach(r => scene.remove(r.rig.root));
            racers = [];
            labelsContainer.innerHTML = '';

            // Create Player + 6 Bots
            for (let i = 0; i <= NUM_BOTS; i++) {
                const palette = RACER_PALETTES[i];
                const rig = createCyclistMesh(palette);

                // Starting grid arrangement: Player starts at back (7th) like Reference 1
                const isPlayer = i === 0;
                const row = isPlayer ? 0 : Math.floor((i - 1) / 2) + 1;
                const col = isPlayer ? 0 : ((i % 2 === 0 ? 1 : -1) * (2.4 + (row % 2) * 1.1));
                const startZ = -row * 8.5;

                rig.root.position.set(col, 0, startZ);
                scene.add(rig.root);

                // Floating HTML Rank Label above each cyclist
                const labelEl = document.createElement('div');
                labelEl.className = `racer-label ${isPlayer ? 'player-label' : ''}`;
                labelEl.textContent = isPlayer ? 'YOU (7th)' : getOrdinal(7 - row * 2 + (i % 2));
                labelsContainer.appendChild(labelEl);

                // Base speeds tuned so player can overtake with good steering & boost pads
                const diffMultiplier = state.botDifficulty === 0 ? 0.91 : (state.botDifficulty === 1 ? 0.97 : 1.02);
                const baseSpeed = isPlayer
                    ? 29.5
                    : (26.8 + Math.random() * 3.8) * diffMultiplier;

                racers.push({
                    id: i,
                    isPlayer,
                    name: palette.name,
                    rig,
                    labelEl,
                    x: col,
                    z: startZ,
                    vx: 0,
                    speed: baseSpeed,
                    baseSpeed: baseSpeed,
                    boostTimer: 0,
                    stumbleTimer: 0,
                    pedalPhase: Math.random() * Math.PI * 2,
                    aiTargetX: col,
                    aiTimer: Math.random() * 1.5,
                    rank: 7,
                    finished: false
                });
            }

            state.targetX = 0;
        }

        function getOrdinal(n) {
            const s = ["th", "st", "nd", "rd"];
            const v = n % 100;
            return n + (s[(v - 20) % 10] || s[v] || s[0]);
        }

        /**************************************************************
         * INPUT HANDLING (Phone Touch Drag + Mouse + Keyboard)
         **************************************************************/
        const keys = { left: false, right: false };

        window.addEventListener('keydown', (e) => {
            if ((e.key === ' ' || e.key === 'Enter') && state.mode === 'ready') {
                e.preventDefault();
                beginRaceMatch();
                return;
            }
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false ? false : true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        });

        function onPointerDown(clientX) {
            initAudio();
            if (state.mode !== 'racing') return;
            state.isDragging = true;
            state.pointerStartX = clientX;
            const player = racers[0];
            if (player) state.playerStartX = player.x;

            // Fade out the helper prompt once player starts steering
            const prompt = document.getElementById('steer-prompt');
            if (prompt) prompt.style.opacity = '0';
        }

        function onPointerMove(clientX) {
            if (!state.isDragging || state.mode !== 'racing') return;
            const deltaNorm = (clientX - state.pointerStartX) / Math.min(window.innerWidth, 500);
            const limit = TRACK_WIDTH / 2 - 1.1;
            state.targetX = Math.max(-limit, Math.min(limit, state.playerStartX + deltaNorm * (TRACK_WIDTH * 1.15)));
        }

        function onPointerUp() {
            state.isDragging = false;
        }

        canvas.addEventListener('mousedown', e => onPointerDown(e.clientX));
        window.addEventListener('mousemove', e => onPointerMove(e.clientX));
        window.addEventListener('mouseup', onPointerUp);

        canvas.addEventListener('touchstart', e => {
            if (e.touches.length > 0) onPointerDown(e.touches[0].clientX);
        }, { passive: true });
        window.addEventListener('touchmove', e => {
            if (e.touches.length > 0) onPointerMove(e.touches[0].clientX);
        }, { passive: true });
        window.addEventListener('touchend', onPointerUp);

        /**************************************************************
         * GAME LOOP & PHYSICS UPDATE
         **************************************************************/
        const clock = new THREE.Clock();
        const projVec = new THREE.Vector3();

        function spawnVictoryConfetti(zPos) {
            const colors = [0xf43f5e, 0xfacc15, 0x38bdf8, 0x84cc16, 0xa855f7];
            for (let i = 0; i < 65; i++) {
                const mat = new THREE.MeshBasicMaterial({
                    color: colors[i % colors.length],
                    side: THREE.DoubleSide
                });
                const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.45, 0.45), mat);
                mesh.position.set(
                    (Math.random() - 0.5) * TRACK_WIDTH,
                    5 + Math.random() * 5,
                    zPos + (Math.random() - 0.5) * 8
                );
                trackGroup.add(mesh);
                confettiParticles.push({
                    mesh,
                    vy: -2 - Math.random() * 3,
                    vx: (Math.random() - 0.5) * 4,
                    vr: (Math.random() - 0.5) * 6
                });
            }
        }

        function updateGame(dt) {
            const player = racers[0];
            state.raceTime += dt;

            // Animate 3D Puffy Sky Clouds & Finish Arch Flags in all active states
            clouds.forEach(c => {
                c.mesh.position.x += c.speedX * dt;
                c.mesh.position.y = c.baseY + Math.sin(state.raceTime * 1.5 + c.phase) * 0.35;
            });

            finishFlags.forEach(f => {
                f.mesh.rotation.y = Math.sin(state.raceTime * 7 + f.phase) * 0.28;
            });

            // Animate Boost Pad Triple Chevrons (Wave pulse forward)
            boostPads.forEach(pad => {
                pad.chevrons.forEach((chev, idx) => {
                    const wave = Math.sin(state.raceTime * 10 - idx * 1.4);
                    const s = 1 + Math.max(0, wave) * 0.22;
                    chev.scale.set(s, 1, s);
                });
            });

            // Pulse Player Ground Indicator Ring
            if (player && player.rig.playerRing) {
                const ringScale = 1 + Math.sin(state.raceTime * 6) * 0.08;
                player.rig.playerRing.scale.set(ringScale, 1, ringScale);
            }

            // Pre-Race 'ready' state: Subtle idle breathing on the starting grid & showcase camera
            if (state.mode === 'ready') {
                state.idleTime += dt;
                racers.forEach((r, idx) => {
                    const phase = state.idleTime * 4 + idx;
                    r.rig.torsoGroup.position.y = 1.68 + Math.sin(phase) * 0.035;
                    r.rig.root.rotation.z = Math.sin(phase * 0.5) * 0.025;
                });

                if (player) {
                    const swayX = Math.sin(state.idleTime * 0.65) * 2.4;
                    camera.position.x += (swayX - camera.position.x) * 4 * dt;
                    camera.position.y += (6.6 - camera.position.y) * 4 * dt;
                    camera.position.z += ((player.z + 11.2) - camera.position.z) * 4 * dt;
                    camera.lookAt(0, 1.5, player.z - 14);
                }
                return;
            }

            if (state.mode !== 'racing') return;

            const trackLimit = TRACK_WIDTH / 2 - 1.05;

            // Keyboard steering support
            if (keys.left) {
                state.targetX = Math.max(-trackLimit, state.targetX - 16 * dt);
                document.getElementById('steer-prompt').style.opacity = '0';
            }
            if (keys.right) {
                state.targetX = Math.min(trackLimit, state.targetX + 16 * dt);
                document.getElementById('steer-prompt').style.opacity = '0';
            }

            // Update all cyclists
            racers.forEach(r => {
                // Boost & Stumble timers
                if (r.boostTimer > 0) r.boostTimer -= dt;
                if (r.stumbleTimer > 0) r.stumbleTimer -= dt;

                let targetSpeed = r.baseSpeed;
                if (r.boostTimer > 0) targetSpeed *= 1.42;
                if (r.stumbleTimer > 0) targetSpeed *= 0.48;

                // Subtle rubber-banding for exciting pack racing
                if (!r.isPlayer && player) {
                    const distToPlayer = player.z - r.z; // positive if bot is ahead
                    if (distToPlayer > 35) targetSpeed *= 0.92;
                    else if (distToPlayer < -30) targetSpeed *= 1.08;
                }

                r.speed += (targetSpeed - r.speed) * 6 * dt;

                // Lateral Steering
                let prevX = r.x;
                if (r.isPlayer) {
                    r.x += (state.targetX - r.x) * 12 * dt;
                } else {
                    r.aiTimer -= dt;
                    if (r.aiTimer <= 0) {
                        r.aiTimer = 0.6 + Math.random() * 1.1;
                        // Look ahead for obstacles to dodge or boost pads to grab
                        let desiredX = (Math.random() - 0.5) * (TRACK_WIDTH - 3);
                        for (let pad of boostPads) {
                            if (pad.z < r.z && pad.z > r.z - 35) {
                                desiredX = pad.x;
                                break;
                            }
                        }
                        for (let obs of obstacles) {
                            if (obs.z < r.z && obs.z > r.z - 22 && Math.abs(obs.x - desiredX) < 1.6) {
                                desiredX = obs.x > 0 ? obs.x - 2.5 : obs.x + 2.5;
                            }
                        }
                        r.aiTargetX = Math.max(-trackLimit, Math.min(trackLimit, desiredX));
                    }
                    r.x += (r.aiTargetX - r.x) * 4.5 * dt;
                }

                r.x = Math.max(-trackLimit, Math.min(trackLimit, r.x));
                r.vx = (r.x - prevX) / Math.max(dt, 0.001);

                // Move forward along -Z
                r.z -= r.speed * dt;

                // Update 3D Transform & Bike Lean
                r.rig.root.position.set(r.x, 0, r.z);
                const leanAngle = THREE.MathUtils.clamp(-r.vx * 0.045, -0.38, 0.38);
                r.rig.root.rotation.z = leanAngle;
                r.rig.root.rotation.y = leanAngle * 0.35;

                // Spin Front & Back Spoked Wheels + Pedaling Animation
                const wheelSpin = r.speed * dt * 1.45;
                r.rig.frontWheel.rotation.x -= wheelSpin;
                r.rig.backWheel.rotation.x -= wheelSpin;

                r.pedalPhase += r.speed * dt * 0.88;
                r.rig.leftLeg.position.y = 0.84 + Math.sin(r.pedalPhase) * 0.24;
                r.rig.leftLeg.position.z = 0.12 + Math.cos(r.pedalPhase) * 0.12;
                r.rig.rightLeg.position.y = 0.84 + Math.sin(r.pedalPhase + Math.PI) * 0.24;
                r.rig.rightLeg.position.z = 0.12 + Math.cos(r.pedalPhase + Math.PI) * 0.12;
                r.rig.torsoGroup.rotation.z = Math.sin(r.pedalPhase) * 0.06;

                // Emit Wheel Dust & Boost Streak Particles
                if (r.boostTimer > 0) {
                    if (Math.random() < 0.75) spawnBoostTrail(r.x, r.z);
                } else if (Math.random() < (r.isPlayer ? 0.35 : 0.12)) {
                    spawnWheelDust(r.x, r.z);
                }

                // Check Boost Pads
                for (let pad of boostPads) {
                    if (Math.abs(r.z - pad.z) < pad.length / 2 && Math.abs(r.x - pad.x) < pad.width / 2 + 0.4) {
                        if (r.boostTimer <= 0.1) {
                            r.boostTimer = 1.35;
                            spawnImpactBurst(r.x, 0.6, r.z, COLORS.boostCyan);
                            if (r.isPlayer) playSound('boost');
                        }
                    }
                }

                // Check Cup Obstacles
                for (let obs of obstacles) {
                    if (!obs.hit && Math.abs(r.z - obs.z) < 1.15 && Math.abs(r.x - obs.x) < obs.radius + 0.45) {
                        obs.hit = true;
                        r.stumbleTimer = 0.65;
                        r.boostTimer = 0;
                        // Launch cup flying with 3D tumbling velocity!
                        obs.vx = (obs.x - r.x) * 8 + (Math.random() - 0.5) * 6;
                        obs.vy = 9.5 + Math.random() * 4;
                        obs.vz = -r.speed * 0.85 - 6;
                        obs.rx = (Math.random() - 0.5) * 14;
                        obs.ry = (Math.random() - 0.5) * 14;
                        obs.rz = (Math.random() - 0.5) * 14;

                        spawnImpactBurst(obs.x, 1.0, obs.z, 0xf43f5e);
                        if (r.isPlayer) playSound('bump');
                    }
                }
            });

            // Update Knocked-Over Tumbling Cup Obstacles
            obstacles.forEach(obs => {
                if (obs.hit && obs.y >= 0) {
                    obs.vy -= 24 * dt; // Gravity
                    obs.x += obs.vx * dt;
                    obs.y += obs.vy * dt;
                    obs.z += obs.vz * dt;

                    if (obs.y < 0.35) {
                        obs.y = 0.35;
                        obs.vy = Math.abs(obs.vy) * 0.42;
                        obs.vx *= 0.75;
                        obs.vz *= 0.75;
                    }

                    obs.mesh.position.set(obs.x, obs.y, obs.z);
                    obs.mesh.rotation.x += obs.rx * dt;
                    obs.mesh.rotation.y += obs.ry * dt;
                    obs.mesh.rotation.z += obs.rz * dt;
                }
            });

            // Update 3D FX Particles (Dust, Boost Streaks, Impact Sparks)
            for (let i = fxParticles.length - 1; i >= 0; i--) {
                const p = fxParticles[i];
                p.life -= dt;
                if (p.life <= 0) {
                    fxGroup.remove(p.mesh);
                    fxParticles.splice(i, 1);
                    continue;
                }
                if (p.gravity) p.vy -= p.gravity * dt;
                p.mesh.position.x += p.vx * dt;
                p.mesh.position.y += p.vy * dt;
                p.mesh.position.z += p.vz * dt;
                const scale = Math.max(0.01, p.life / p.maxLife);
                p.mesh.scale.set(scale, scale, scale);
            }

            // Rider-to-Rider Side Bump Physics
            for (let i = 0; i < racers.length; i++) {
                for (let j = i + 1; j < racers.length; j++) {
                    const a = racers[i];
                    const b = racers[j];
                    if (Math.abs(a.z - b.z) < 1.9 && Math.abs(a.x - b.x) < 1.15) {
                        const push = a.x < b.x ? -0.18 : 0.18;
                        a.x = Math.max(-trackLimit, Math.min(trackLimit, a.x + push));
                        b.x = Math.max(-trackLimit, Math.min(trackLimit, b.x - push));
                        if (a.isPlayer || b.isPlayer) {
                            state.targetX = racers[0].x;
                        }
                    }
                }
            }

            // Sort Racers by Z to Compute Live Rankings
            const sorted = [...racers].sort((a, b) => a.z - b.z);
            sorted.forEach((r, idx) => {
                r.rank = idx + 1;
                r.labelEl.textContent = getOrdinal(r.rank);
            });

            // Update Player HUD
            if (player) {
                const ord = getOrdinal(player.rank);
                document.getElementById('hud-rank-top').textContent = ord;
                document.getElementById('big-rank-display').textContent = ord;

                const progress = THREE.MathUtils.clamp(Math.abs(player.z) / TRACK_LENGTH, 0, 1);
                document.getElementById('progress-fill').style.width = `${(progress * 100).toFixed(1)}%`;

                // Boost overlay effect
                document.getElementById('boost-overlay').style.opacity = player.boostTimer > 0 ? '1' : '0';

                // Dynamic Camera Chase
                const camHeight = state.camMode === 0 ? 5.6 : 8.5;
                const camDist = state.camMode === 0 ? 10.2 : 13.5;
                const targetFov = player.boostTimer > 0 ? 66 : 58;
                camera.fov += (targetFov - camera.fov) * 6 * dt;
                camera.updateProjectionMatrix();

                camera.position.x += (player.x * 0.55 - camera.position.x) * 8 * dt;
                camera.position.y += (camHeight - camera.position.y) * 6 * dt;
                camera.position.z = player.z + camDist;
                camera.lookAt(player.x * 0.3, 1.4, player.z - 14);

                // Move Directional Light with player so shadows stay crisp
                dirLight.position.set(player.x + 25, 60, player.z + 30);
                dirLight.target.position.set(player.x, 0, player.z - 15);
                dirLight.target.updateMatrixWorld();

                // Check Finish Line!
                if (player.z <= -TRACK_LENGTH) {
                    finishRace(player.rank);
                }
            }

            // Animate Confetti if any
            confettiParticles.forEach(p => {
                p.mesh.position.y += p.vy * dt;
                p.mesh.position.x += p.vx * dt;
                p.mesh.rotation.x += p.vr * dt;
                p.mesh.rotation.y += p.vr * dt;
            });
        }

        function updateFloatingLabels() {
            const halfW = window.innerWidth / 2;
            const halfH = window.innerHeight / 2;

            racers.forEach(r => {
                projVec.set(r.x, 3.15, r.z);
                projVec.project(camera);

                if (projVec.z > 1 || projVec.z < -1) {
                    r.labelEl.style.opacity = '0';
                    return;
                }

                const screenX = (projVec.x * halfW) + halfW;
                const screenY = -(projVec.y * halfH) + halfH;

                r.labelEl.style.opacity = '1';
                r.labelEl.style.left = `${screenX}px`;
                r.labelEl.style.top = `${screenY}px`;
            });
        }

        /**************************************************************
         * RACE COMPLETION & UI CONTROLS
         **************************************************************/
        function finishRace(finalRank) {
            state.mode = 'finished';
            document.getElementById('boost-overlay').style.opacity = '0';
            document.getElementById('btn-pause').classList.add('invisible');
            spawnVictoryConfetti(-TRACK_LENGTH);

            const modal = document.getElementById('game-modal');
            const badge = document.getElementById('modal-badge');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const nextBtn = document.getElementById('btn-next');

            modal.classList.remove('hidden');
            title.textContent = `${getOrdinal(finalRank)} Place!`;

            if (finalRank === 1) {
                playSound('win');
                badge.textContent = '🏆 CHAMPION!';
                badge.className = 'inline-block bg-[#facc15] text-[#161e31] border-[3px] border-[#161e31] px-4 py-1 rounded-full font-extrabold text-sm mb-2 shadow-[0_3px_0_#161e31]';
                desc.textContent = `Awesome riding! You conquered Level ${state.level} in 1st place!`;
                nextBtn.classList.remove('hidden');
            } else if (finalRank <= 3) {
                playSound('win');
                badge.textContent = '🥈 PODIUM FINISH!';
                badge.className = 'inline-block bg-[#38bdf8] text-white border-[3px] border-[#161e31] px-4 py-1 rounded-full font-extrabold text-sm mb-2 shadow-[0_3px_0_#161e31]';
                desc.textContent = `Great podium finish! Ready for the next track?`;
                nextBtn.classList.remove('hidden');
            } else {
                playSound('lose');
                badge.textContent = 'KEEP PEDALING!';
                badge.className = 'inline-block bg-[#f43f5e] text-white border-[3px] border-[#161e31] px-4 py-1 rounded-full font-extrabold text-sm mb-2 shadow-[0_3px_0_#161e31]';
                desc.textContent = `Hit the blue boost pads and dodge the cups to reach the podium!`;
                nextBtn.classList.add('hidden');
            }
        }

        function startLevel(lvl) {
            state.level = lvl;
            state.mode = 'ready';
            state.idleTime = 0;

            document.getElementById('hud-level').textContent = state.level;
            document.getElementById('level-badge').textContent = state.level;
            document.getElementById('hud-rank-top').textContent = '7th';
            document.getElementById('big-rank-display').textContent = '7th';
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('boost-overlay').style.opacity = '0';

            document.getElementById('game-modal').classList.add('hidden');
            document.getElementById('start-overlay').classList.remove('hidden');
            document.getElementById('btn-pause').classList.add('invisible');
            document.getElementById('btn-pause').textContent = 'PAUSE';
            document.getElementById('steer-prompt').style.opacity = '1';

            buildTrack();
            spawnRacers();

            // Position camera immediately behind the starting grid
            const player = racers[0];
            if (player) {
                camera.position.set(0, 6.6, player.z + 11.2);
                camera.lookAt(0, 1.5, player.z - 14);
            }
        }

        async function beginRaceMatch() {
            if (state.mode !== 'ready') return;
            await initAudio();
            playSound('start');

            state.mode = 'racing';
            document.getElementById('start-overlay').classList.add('hidden');
            document.getElementById('btn-pause').classList.remove('invisible');

            // Give the player a crisp mini launch boost off the line
            if (racers[0]) {
                racers[0].boostTimer = 0.35;
            }
        }

        // UI Button Listeners
        document.getElementById('btn-start-match').addEventListener('click', () => {
            beginRaceMatch();
        });

        document.getElementById('btn-retry').addEventListener('click', () => {
            playSound('click');
            startLevel(state.level);
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            playSound('click');
            startLevel(state.level + 1);
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            initAudio();
            playSound('click');
            if (state.mode === 'racing') {
                state.mode = 'paused';
                document.getElementById('btn-pause').textContent = 'RESUME';
                const modal = document.getElementById('game-modal');
                document.getElementById('modal-badge').textContent = 'GAME PAUSED';
                document.getElementById('modal-title').textContent = `Level ${state.level}`;
                document.getElementById('modal-desc').textContent = 'Take a breather or restart the track anytime.';
                document.getElementById('btn-next').classList.add('hidden');
                modal.classList.remove('hidden');
            } else if (state.mode === 'paused') {
                state.mode = 'racing';
                document.getElementById('btn-pause').textContent = 'PAUSE';
                document.getElementById('game-modal').classList.add('hidden');
            }
        });

        document.getElementById('btn-sound').addEventListener('click', () => {
            initAudio();
            soundEnabled = !soundEnabled;
            document.getElementById('sound-icon').textContent = soundEnabled ? '🔊' : '🔇';
            document.getElementById('sound-text').textContent = soundEnabled ? 'Sound' : 'Muted';
            if (soundEnabled) playSound('click');
        });

        document.getElementById('btn-bot-mode').addEventListener('click', () => {
            initAudio();
            playSound('click');
            state.botDifficulty = (state.botDifficulty + 1) % 3;
            const labels = ['vs 6 Bots: Easy', 'vs 6 Bots: Normal', 'vs 6 Bots: Pro'];
            document.getElementById('bot-text').textContent = labels[state.botDifficulty];
            startLevel(state.level);
        });

        document.getElementById('btn-cam').addEventListener('click', () => {
            initAudio();
            playSound('click');
            state.camMode = (state.camMode + 1) % 2;
            document.getElementById('cam-text').textContent = state.camMode === 0 ? 'Cam: Chase' : 'Cam: High';
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        /**************************************************************
         * INITIALIZE & START ANIMATION LOOP
         **************************************************************/
        window.onload = function () {
            startLevel(1);

            function animate() {
                requestAnimationFrame(animate);
                const dt = Math.min(clock.getDelta(), 0.05);
                updateGame(dt);
                renderer.render(scene, camera);
                updateFloatingLabels();
            }

            animate();
        };
    </script>
</body>
</html>
